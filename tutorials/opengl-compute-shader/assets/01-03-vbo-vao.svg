 sans-serif">location = 0</text><text x="642" y="315" fill="#e5e7eb" font-size="22" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">size = 3 · float</text><text x="642" y="360" fill="#e5e7eb" font-size="22" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">offset = 0</text><text x="642" y="405" fill="#4ade80" font-size="22" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">enabled = true</text><line x1="790" y1="320" x2="890" y2="320" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><rect x="895" y="215" width="260" height="170" rx="16" fill="#172554" stroke="#4ade80" stroke-width="3"/><text x="1025.0" y="258" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">Vertex Shader</text><text x="1025.0" y="291" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">aPos 读取每个顶点</text>
