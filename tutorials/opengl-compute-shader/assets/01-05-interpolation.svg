<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/></marker></defs>
<rect width="1200" height="675" fill="#0f172a"/>
<text x="60" y="62" fill="#e5e7eb" font-size="34" text-anchor="start" font-weight="700" font-family="Microsoft YaHei, Segoe UI, sans-serif">Hello Triangle 与插值</text>
<text x="60" y="100" fill="#a5b4fc" font-size="20" text-anchor="start" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">vColor 在顶点处确定，在三角形内部连续变化</text>
<defs><linearGradient id="tri" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ef4444"/><stop offset="0.5" stop-color="#22c55e"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><polygon points="350,155 120,500 580,500" fill="url(#tri)" stroke="#e5e7eb" stroke-width="3"/><circle cx="350" cy="155" r="14" fill="#3b82f6"/><text x="350" y="127" fill="#e5e7eb" font-size="19" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">B = (0,0,1)</text><circle cx="120" cy="500" r="14" fill="#ef4444"/><text x="120" y="472" fill="#e5e7eb" font-size="19" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">R = (1,0,0)</text><circle cx="580" cy="500" r="14" fill="#22c55e"/><text x="580" y="472" fill="#e5e7eb" font-size="19" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">G = (0,1,0)</text><rect x="690" y="175" width="430" height="105" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="3"/><text x="905.0" y="218" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">顶点阶段</text><text x="905.0" y="251" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">每个顶点输出一种颜色</text><rect x="690" y="330" width="430" height="105" rx="16" fill="#172554" stroke="#4ade80" stroke-width="3"/><text x="905.0" y="373" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">光栅化阶段</text><text x="905.0" y="406" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">按 Fragment 位置插值</text><line x1="905" y1="285" x2="905" y2="325" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><text x="905" y="490" fill="#e5e7eb" font-size="21" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">内部颜色 = 各顶点颜色的加权混合</text>
