<rect width="1200" height="675" fill="#0f172a"/>
<text x="60" y="62" fill="#e5e7eb" font-size="34" text-anchor="start" font-weight="700" font-family="Microsoft YaHei, Segoe UI, sans-serif">GLSL：类型、限定符与数据流</text>
<text x="60" y="100" fill="#a5b4fc" font-size="20" text-anchor="start" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">in / out 描述阶段接口，uniform 接收 CPU 参数</text>
<rect x="45" y="155" width="250" height="110" rx="16" fill="#172554" stroke="#fb923c" stroke-width="3"/><text x="170.0" y="198" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">Attribute</text><text x="170.0" y="231" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">in · 每顶点不同</text><rect x="45" y="390" width="250" height="110" rx="16" fill="#172554" stroke="#22d3ee" stroke-width="3"/><text x="170.0" y="433" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">Uniform</text><text x="170.0" y="466" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">一次绘制中保持一致</text><rect x="390" y="155" width="290" height="110" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="3"/><text x="535.0" y="198" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">Vertex Shader</text><text x="535.0" y="231" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">vec3 / mat4 / gl_Position</text><rect x="390" y="390" width="290" height="110" rx="16" fill="#172554" stroke="#4ade80" stroke-width="3"/><text x="535.0" y="433" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">Fragment Shader</text><text x="535.0" y="466" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">texture / mix / clamp</text><rect x="850" y="250" width="290" height="130" rx="16" fill="#172554" stroke="#fb923c" stroke-width="3"/><text x="995.0" y="293" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">varying 数据</text><text x="995.0" y="326" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">out → in · 自动插值</text><line x1="300" y1="210" x2="380" y2="210" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><line x1="300" y1="445" x2="380" y2="445" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><line x1="685" y1="210" x2="840" y2="285" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><line x1="685" y1="445" x2="840" y2="350" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><line x1="975" y1="380" x2="545" y2="380" stroke="#a5b4fc" stroke-width="3" stroke-dasharray="8 6"/><text x="600" y="555" fill="#e5e7eb" font-size="22" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">GLSL 是强类型语言；构造函数、分量访问和内置函数组合成计算</text>
