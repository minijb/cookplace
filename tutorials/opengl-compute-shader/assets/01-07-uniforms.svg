45" x2="470" y2="245" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><text x="412.5" y="333.0" fill="#22d3ee" font-size="17" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">attribute</text><line x1="635" y1="290" x2="635" y2="375" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><text x="635.0" y="320.5" fill="#22d3ee" font-size="17" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">vColor / gl_Position</text><rect x="900" y="255" width="245" height="120" rx="16" fill="#172554" stroke="#fb923c" stroke-width="3"/><text x="1022.5" y="298" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">一次 Draw Call</text><text x="1022.5" y="331" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">所有调用共享 uniform</text><line x1="785" y1="220" x2="890" y2="300" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><line x1="785" y1="445" x2="890" y2="340" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="580" fill="#e5e7eb" font-size="23" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">先 glUseProgram，再更新该 Program 的 uniform</text>
