<rect width="1200" height="675" fill="#0f172a"/>
<text x="60" y="62" fill="#e5e7eb" font-size="34" text-anchor="start" font-weight="700" font-family="Microsoft YaHei, Segoe UI, sans-serif">Depth Test 与 Face Culling</text>
<text x="60" y="100" fill="#a5b4fc" font-size="20" text-anchor="start" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">一个解决前后遮挡，一个减少不可见面的绘制</text>
<rect x="45" y="150" width="280" height="105" rx="16" fill="#172554" stroke="#fb923c" stroke-width="3"/><text x="185.0" y="193" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">新 Fragment</text><text x="185.0" y="226" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">depth = 0.45</text><rect x="45" y="400" width="280" height="105" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="3"/><text x="185.0" y="443" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">Depth Buffer</text><text x="185.0" y="476" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">旧值 = 0.60</text><rect x="450" y="260" width="300" height="130" rx="16" fill="#172554" stroke="#4ade80" stroke-width="3"/><text x="600.0" y="303" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">GL_LESS</text><text x="600.0" y="336" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">0.45 &lt; 0.60 → 通过并写入</text><line x1="330" y1="202" x2="440" y2="290" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><line x1="330" y1="452" x2="440" y2="360" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><rect x="895" y="150" width="255" height="105" rx="16" fill="#172554" stroke="#22d3ee" stroke-width="3"/><text x="1022.5" y="193" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">Depth Test</text><text x="1022.5" y="226" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">保留更近表面</text><rect x="895" y="400" width="255" height="105" rx="16" fill="#172554" stroke="#22d3ee" stroke-width="3"/><text x="1022.5" y="443" fill="#e5e7eb" font-size="24" text-anchor="middle" font-weight="600" font-family="Microsoft YaHei, Segoe UI, sans-serif">Face Culling</text><text x="1022.5" y="476" fill="#a5b4fc" font-size="18" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">按屏幕绕序丢弃背面</text><line x1="755" y1="325" x2="885" y2="205" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><line x1="755" y1="325" x2="885" y2="452" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="565" fill="#e5e7eb" font-size="21" text-anchor="middle" font-weight="400" font-family="Microsoft YaHei, Segoe UI, sans-serif">每帧清除 Depth Buffer；从立方体外部观察通常使用 CCW + Cull Back</text>
